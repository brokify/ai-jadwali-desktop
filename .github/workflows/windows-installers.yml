name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installers:
    name: Build EXE and MSI
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify

      - name: Run frontend and Rust checks
        run: npm run check

      - name: Audit frontend dependencies
        run: npm audit

      - name: Build Windows installers
        run: npm run bundle:windows

      - name: Package portable edition
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version 1.0.1

      - name: Upload EXE and MSI
        uses: actions/upload-artifact@v7
        with:
          name: AI-Jadwali-Desktop-1.0.1-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: AI-Jadwali-Desktop-1.0.1-Portable-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: dist-portable/AI-Jadwali-Desktop-1.0.1-Portable-Windows-x64.zip
